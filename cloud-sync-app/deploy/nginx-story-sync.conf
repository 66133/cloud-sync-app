# nginx 反向代理配置（已有 nginx 的服务器用这个）
#
# 步骤：
#   1. 域名 DNS A 记录指到本服务器公网 IP
#   2. 申请证书（如 certbot）后，把下面两处证书路径改成你的
#   3. 本文件保存为 /etc/nginx/sites-available/story-sync.conf，
#      ln -s 到 sites-enabled/ 后 nginx -t && systemctl reload nginx
#
# 注意：proxy_buffering off 与长超时是 SSE 实时同步和 AI 流式输出的关键，勿删。

server {
    listen 80;
    server_name story.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name story.example.com;

    ssl_certificate     /etc/letsencrypt/live/story.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/story.example.com/privkey.pem;

    # 上传小说全文/整库导入可能较大
    client_max_body_size 128m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ---- SSE / 流式输出关键配置 ----
        proxy_set_header Connection '';   # 保持长连接
        proxy_buffering off;              # 不缓冲，字节直达浏览器
        proxy_cache off;
        proxy_read_timeout 3600s;         # SSE 长连接最多挂 1 小时（内置 20s 心跳保活）
        proxy_send_timeout 3600s;
    }
}
